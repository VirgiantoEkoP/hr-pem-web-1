<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Form Penilaian · HR Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/sidebar.css" rel="stylesheet" />
    <link href="../../assets/css/components.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        HRAuth.requireAuth("admin"),
      );
    </script>

    <div
      data-active="penilaian"
      data-base-path="../.."
      data-component="navbar"
      data-variant="admin"
    ></div>
    <main class="main-content">
      <div
        data-base-path="../.."
        data-component="header"
        data-subtitle="Input nilai kinerja"
        data-title="Form Penilaian"
        data-variant="admin"
      ></div>
      <div class="card card-clean">
        <div class="card-body">
          <form id="nilaiForm" novalidate="">
            <div class="validation-summary"></div>
            <input name="id" type="hidden" />
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label required-mark">Karyawan Dinilai</label
                ><select
                  class="form-select"
                  data-label="Karyawan"
                  data-validate="required"
                  id="karyawanSelect"
                  name="id_karyawan"
                ></select>
              </div>
              <div class="col-md-6">
                <label class="form-label required-mark">Penilai</label
                ><select
                  class="form-select"
                  data-label="Penilai"
                  data-validate="required"
                  id="penilaiSelect"
                  name="id_penilai"
                ></select>
              </div>
              <div class="col-md-4">
                <label class="form-label required-mark">Periode</label
                ><input
                  class="form-control"
                  data-label="Periode"
                  data-validate="required"
                  name="periode"
                  value="Juni"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label required-mark">Tahun</label
                ><input
                  class="form-control"
                  data-label="Tahun"
                  data-validate="required|numeric"
                  name="tahun"
                  value="2026"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label required-mark">Status</label
                ><select
                  class="form-select"
                  data-validate="required"
                  name="status"
                >
                  <option>Draft</option>
                  <option>Final</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label required-mark">Kedisiplinan</label
                ><input
                  class="form-control score"
                  data-validate="required|between:0,100"
                  name="nilai_kedisiplinan"
                  type="number"
                />
              </div>
              <div class="col-md-3">
                <label class="form-label required-mark">Kerjasama</label
                ><input
                  class="form-control score"
                  data-validate="required|between:0,100"
                  name="nilai_kerjasama"
                  type="number"
                />
              </div>
              <div class="col-md-3">
                <label class="form-label required-mark">Produktivitas</label
                ><input
                  class="form-control score"
                  data-validate="required|between:0,100"
                  name="nilai_produktivitas"
                  type="number"
                />
              </div>
              <div class="col-md-3">
                <label class="form-label required-mark">Inisiatif</label
                ><input
                  class="form-control score"
                  data-validate="required|between:0,100"
                  name="nilai_inisiatif"
                  type="number"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label">Nilai Total</label
                ><input
                  class="form-control"
                  id="nilaiTotal"
                  name="nilai_total"
                  readonly=""
                />
              </div>
              <div class="col-md-8">
                <label class="form-label">Catatan Penilai</label
                ><textarea
                  class="form-control"
                  name="catatan_penilai"
                  rows="3"
                ></textarea>
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <a class="btn btn-light" href="index.html">Batal</a
              ><button class="btn btn-primary" type="submit">Simpan</button>
            </div>
          </form>
        </div>
      </div>
      <div
        data-base-path="../.."
        data-component="footer"
        data-variant="admin"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/validation.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../components/components.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
