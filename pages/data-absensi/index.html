<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Data Absensi · HR Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/sidebar.css" rel="stylesheet" />
    <link href="../../assets/css/components.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        HRAuth.requireAuth("admin"),
      );
    </script>

    <div
      data-active="absensi"
      data-base-path="../.."
      data-component="navbar"
      data-variant="admin"
    ></div>
    <main class="main-content">
      <div
        data-base-path="../.."
        data-component="header"
        data-subtitle="Monitoring absensi karyawan"
        data-title="Data Absensi"
        data-variant="admin"
      ></div>
      <div class="card card-clean">
        <div class="card-body">
          <div
            class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
          >
            <div>
              <div class="data-card-title">Rekap Absensi</div>
              <div class="text-muted-small">
                Monitoring absensi seluruh karyawan.
              </div>
            </div>
            <button class="btn btn-outline-secondary" id="exportAbsensi">
              <i class="bi bi-download me-1"></i>CSV
            </button>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-md-4">
              <input
                class="form-control"
                id="searchAbsensi"
                placeholder="Cari nama karyawan"
              />
            </div>
            <div class="col-md-3">
              <input class="form-control" id="filterTanggal" type="date" />
            </div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Tanggal</th>
                  <th>Karyawan</th>
                  <th>Masuk</th>
                  <th>Keluar</th>
                  <th>Status</th>
                  <th>Lokasi</th>
                  <th class="text-end">Aksi</th>
                </tr>
              </thead>
              <tbody id="absensiTable"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div
        data-base-path="../.."
        data-component="footer"
        data-variant="admin"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/validation.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../components/components.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
