<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Form Departemen · HR Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/sidebar.css" rel="stylesheet" />
    <link href="../../assets/css/components.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        HRAuth.requireAuth("admin"),
      );
    </script>

    <div
      data-active="departemen"
      data-base-path="../.."
      data-component="navbar"
      data-variant="admin"
    ></div>
    <main class="main-content">
      <div
        data-base-path="../.."
        data-component="header"
        data-subtitle="Tambah atau edit departemen"
        data-title="Form Departemen"
        data-variant="admin"
      ></div>
      <div class="card card-clean">
        <div class="card-body">
          <form id="departemenForm" novalidate="">
            <div class="validation-summary"></div>
            <input name="id" type="hidden" />
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label required-mark">Kode</label
                ><input
                  class="form-control"
                  data-label="Kode"
                  data-validate="required|min:2|max:12"
                  name="kode"
                />
              </div>
              <div class="col-md-8">
                <label class="form-label required-mark">Nama Departemen</label
                ><input
                  class="form-control"
                  data-label="Nama Departemen"
                  data-validate="required|min:3"
                  name="nama"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Kepala Departemen</label
                ><input
                  class="form-control"
                  data-label="Kepala Departemen"
                  data-validate="max:80"
                  name="kepala_departemen"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label required-mark">Status</label
                ><select
                  class="form-select"
                  data-label="Status"
                  data-validate="required"
                  name="status"
                >
                  <option value="Aktif">Aktif</option>
                  <option value="Nonaktif">Nonaktif</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Deskripsi</label
                ><textarea
                  class="form-control"
                  data-label="Deskripsi"
                  data-validate="max:300"
                  name="deskripsi"
                  rows="4"
                ></textarea>
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <a class="btn btn-light" href="index.html">Batal</a
              ><button class="btn btn-primary" type="submit">
                <i class="bi bi-save me-1"></i>Simpan
              </button>
            </div>
          </form>
        </div>
      </div>
      <div
        data-base-path="../.."
        data-component="footer"
        data-variant="admin"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/validation.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../components/components.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
