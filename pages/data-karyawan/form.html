<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Form Karyawan · HR Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/sidebar.css" rel="stylesheet" />
    <link href="../../assets/css/components.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        HRAuth.requireAuth("admin"),
      );
    </script>

    <div
      data-active="karyawan"
      data-base-path="../.."
      data-component="navbar"
      data-variant="admin"
    ></div>
    <main class="main-content">
      <div
        data-base-path="../.."
        data-component="header"
        data-subtitle="Tambah atau edit data karyawan"
        data-title="Form Karyawan"
        data-variant="admin"
      ></div>
      <div class="card card-clean">
        <div class="card-body">
          <form id="karyawanForm" novalidate="">
            <div class="validation-summary"></div>
            <input name="id" type="hidden" />
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label required-mark">NIK</label
                ><input
                  class="form-control"
                  data-label="NIK"
                  data-validate="required|min:3|max:30"
                  name="nik"
                />
              </div>
              <div class="col-md-8">
                <label class="form-label required-mark">Nama Lengkap</label
                ><input
                  class="form-control"
                  data-label="Nama Lengkap"
                  data-validate="required|min:3"
                  name="nama_lengkap"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label required-mark">Email</label
                ><input
                  class="form-control"
                  data-label="Email"
                  data-validate="required|email"
                  name="email"
                  type="email"
                />
              </div>
              <div class="col-md-3">
                <label class="form-label">Password Portal</label
                ><input
                  class="form-control"
                  data-label="Password Portal"
                  data-validate="min:6"
                  name="password"
                  value="123456"
                />
              </div>
              <div class="col-md-3">
                <label class="form-label">Telepon</label
                ><input
                  class="form-control"
                  data-label="Telepon"
                  data-validate="max:20"
                  name="no_telepon"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label required-mark">Departemen</label
                ><select
                  class="form-select"
                  data-label="Departemen"
                  data-validate="required"
                  id="departemenSelect"
                  name="id_departemen"
                ></select>
              </div>
              <div class="col-md-4">
                <label class="form-label required-mark">Divisi</label
                ><select
                  class="form-select"
                  data-label="Divisi"
                  data-validate="required"
                  id="divisiSelect"
                  name="id_divisi"
                ></select>
              </div>
              <div class="col-md-4">
                <label class="form-label required-mark">Jabatan</label
                ><select
                  class="form-select"
                  data-label="Jabatan"
                  data-validate="required"
                  id="jabatanSelect"
                  name="id_jabatan"
                ></select>
              </div>
              <div class="col-md-6">
                <label class="form-label required-mark">Tanggal Bergabung</label
                ><input
                  class="form-control"
                  data-label="Tanggal Bergabung"
                  data-validate="required|date"
                  name="tanggal_bergabung"
                  type="date"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label required-mark">Status</label
                ><select
                  class="form-select"
                  data-label="Status"
                  data-validate="required"
                  name="status"
                >
                  <option>Aktif</option>
                  <option>Nonaktif</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Foto Profil (Base64 opsional)</label
                ><input
                  class="form-control"
                  name="foto"
                  placeholder="URL/Base64 foto bila ada"
                />
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <a class="btn btn-light" href="index.html">Batal</a
              ><button class="btn btn-primary" type="submit">Simpan</button>
            </div>
          </form>
        </div>
      </div>
      <div
        data-base-path="../.."
        data-component="footer"
        data-variant="admin"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/validation.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../components/components.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
