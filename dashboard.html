<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Dashboard · HR Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/main.css" rel="stylesheet" />
    <link href="assets/css/sidebar.css" rel="stylesheet" />
    <link href="assets/css/components.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        HRAuth.requireAuth("admin"),
      );
    </script>

    <div
      data-active="dashboard"
      data-base-path="."
      data-component="navbar"
      data-variant="admin"
    ></div>
    <main class="main-content">
      <div
        data-base-path="."
        data-component="header"
        data-subtitle="Ringkasan operasional HR"
        data-title="Dashboard"
        data-variant="admin"
      ></div>
      <div class="row g-3 mb-3">
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card p-3">
            <div class="d-flex justify-content-between">
              <div>
                <div class="text-muted-small">Total Karyawan</div>
                <div class="h3 fw-bold" id="karyawanTotal">0</div>
              </div>
              <div class="stat-icon"><i class="bi bi-people"></i></div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card p-3">
            <div class="d-flex justify-content-between">
              <div>
                <div class="text-muted-small">Absensi Hadir</div>
                <div class="h3 fw-bold" id="hadirTotal">0</div>
              </div>
              <div class="stat-icon"><i class="bi bi-clock"></i></div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card p-3">
            <div class="d-flex justify-content-between">
              <div>
                <div class="text-muted-small">Tugas Tercatat</div>
                <div class="h3 fw-bold" id="tugasTotal">0</div>
              </div>
              <div class="stat-icon"><i class="bi bi-list-task"></i></div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card p-3">
            <div class="d-flex justify-content-between">
              <div>
                <div class="text-muted-small">Rata-rata Nilai</div>
                <div class="h3 fw-bold" id="nilaiAvg">0</div>
              </div>
              <div class="stat-icon">
                <i class="bi bi-clipboard2-check"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-lg-7">
          <div class="card card-clean">
            <div class="card-body">
              <div class="data-card-title mb-3">
                Distribusi Karyawan per Departemen
              </div>
              <div style="height: 310px"><canvas id="deptChart"></canvas></div>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card card-clean">
            <div class="card-body">
              <div class="data-card-title mb-3">Komposisi Status Absensi</div>
              <div style="height: 310px"><canvas id="attChart"></canvas></div>
            </div>
          </div>
        </div>
      </div>
      <div class="card card-clean">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="data-card-title">Absensi Terbaru</div>
            <a
              class="btn btn-outline-primary btn-sm"
              href="pages/data-absensi/index.html"
              >Lihat semua</a
            >
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Tanggal</th>
                  <th>Karyawan</th>
                  <th>Masuk</th>
                  <th>Keluar</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="recentAbsensi"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div
        data-base-path="."
        data-component="footer"
        data-variant="admin"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/validation.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="components/components.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
