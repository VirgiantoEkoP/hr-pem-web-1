<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Beranda Karyawan · HR Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/main.css" rel="stylesheet" />
    <link href="../assets/css/sidebar.css" rel="stylesheet" />
    <link href="../assets/css/components.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        HRAuth.requireAuth("employee"),
      );
    </script>
    <div
      data-active="beranda"
      data-base-path=".."
      data-component="navbar"
      data-variant="employee"
    ></div>
    <main class="employee-shell">
      <div
        data-base-path=".."
        data-component="header"
        data-title="Beranda Karyawan"
        data-variant="employee"
      ></div>
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <div class="stat-card p-3">
            <div class="text-muted-small">Departemen</div>
            <div class="h5 fw-bold" id="empDept">-</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card p-3">
            <div class="text-muted-small">Jabatan</div>
            <div class="h5 fw-bold" id="empJabatan">-</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card p-3">
            <div class="text-muted-small">Nilai Terakhir</div>
            <div class="h5 fw-bold" id="empNilai">-</div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="stat-card p-3">
            <div class="text-muted-small">Total Absensi</div>
            <div class="h3 fw-bold" id="empAbsTotal">0</div>
            <a class="btn btn-sm btn-primary mt-2" href="absensi/index.html"
              >Absen sekarang</a
            >
          </div>
        </div>
        <div class="col-md-6">
          <div class="stat-card p-3">
            <div class="text-muted-small">Total Tugas</div>
            <div class="h3 fw-bold" id="empTaskTotal">0</div>
            <a
              class="btn btn-sm btn-outline-primary mt-2"
              href="tugas/form.html"
              >Input tugas</a
            >
          </div>
        </div>
      </div>
      <div class="card card-clean">
        <div class="card-body">
          <div class="data-card-title mb-3">Tugas Terbaru</div>
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Tanggal</th>
                  <th>Tugas</th>
                  <th>Status</th>
                  <th>Progress</th>
                </tr>
              </thead>
              <tbody id="empTaskRecent"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div
        data-base-path=".."
        data-component="footer"
        data-variant="employee"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../components/components.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
