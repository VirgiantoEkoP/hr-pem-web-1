<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Form Tugas · HR Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/sidebar.css" rel="stylesheet" />
    <link href="../../assets/css/components.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        HRAuth.requireAuth("employee"),
      );
    </script>
    <div
      data-active="tugas"
      data-base-path="../.."
      data-component="navbar"
      data-variant="employee"
    ></div>
    <main class="employee-shell">
      <div
        data-base-path="../.."
        data-component="header"
        data-title="Form Tugas"
        data-variant="employee"
      ></div>
      <div class="card card-clean">
        <div class="card-body">
          <form id="employeeTugasForm" novalidate="">
            <div class="validation-summary"></div>
            <input name="id" type="hidden" />
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label required-mark">Tanggal</label
                ><input
                  class="form-control"
                  data-validate="required|date"
                  name="tanggal"
                  type="date"
                />
              </div>
              <div class="col-md-8">
                <label class="form-label required-mark">Judul Tugas</label
                ><input
                  class="form-control"
                  data-validate="required|min:4"
                  name="judul_tugas"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label required-mark">Prioritas</label
                ><select
                  class="form-select"
                  data-validate="required"
                  name="prioritas"
                >
                  <option>Rendah</option>
                  <option>Sedang</option>
                  <option>Tinggi</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label required-mark">Status</label
                ><select
                  class="form-select"
                  data-validate="required"
                  name="status"
                >
                  <option>Proses</option>
                  <option>Selesai</option>
                  <option>Tertunda</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Jam Mulai</label
                ><input class="form-control" name="jam_mulai" type="time" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Jam Selesai</label
                ><input class="form-control" name="jam_selesai" type="time" />
              </div>
              <div class="col-md-4">
                <label class="form-label required-mark">Progress (%)</label
                ><input
                  class="form-control"
                  data-validate="required|between:0,100"
                  name="progress_persen"
                  type="number"
                  value="0"
                />
              </div>
              <div class="col-12">
                <label class="form-label required-mark">Deskripsi</label
                ><textarea
                  class="form-control"
                  data-validate="required|min:8"
                  name="deskripsi"
                  rows="3"
                ></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">Catatan</label
                ><textarea
                  class="form-control"
                  name="catatan"
                  rows="2"
                ></textarea>
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <a class="btn btn-light" href="index.html">Batal</a
              ><button class="btn btn-primary" type="submit">Simpan</button>
            </div>
          </form>
        </div>
      </div>
      <div
        data-base-path="../.."
        data-component="footer"
        data-variant="employee"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/validation.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../components/components.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
