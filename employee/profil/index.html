<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Profil Saya · HR Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/sidebar.css" rel="stylesheet" />
    <link href="../../assets/css/components.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        HRAuth.requireAuth("employee"),
      );
    </script>
    <div
      data-active="profil"
      data-base-path="../.."
      data-component="navbar"
      data-variant="employee"
    ></div>
    <main class="employee-shell">
      <div
        data-base-path="../.."
        data-component="header"
        data-title="Profil Saya"
        data-variant="employee"
      ></div>
      <div class="row g-3">
        <div class="col-lg-5">
          <div class="card card-clean">
            <div class="card-body" id="profileInfo"></div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card card-clean">
            <div class="card-body">
              <div class="data-card-title mb-3">Ubah Password</div>
              <form id="profilePasswordForm" novalidate="">
                <div class="validation-summary"></div>
                <div class="mb-3">
                  <label class="form-label required-mark">Password Baru</label
                  ><input
                    class="form-control"
                    data-validate="required|min:6"
                    name="password"
                    type="password"
                  />
                </div>
                <button class="btn btn-primary">Simpan Password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div
        data-base-path="../.."
        data-component="footer"
        data-variant="employee"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/validation.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../components/components.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
